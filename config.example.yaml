# elrsctrl profile. Copy to config.yaml (or pass --config) and edit, or just
# tweak everything live in the app's Settings/Mapping screens and hit Save.

serial:
  port: ""        # "COM5" (Windows) or "/dev/ttyUSB0" (Linux/Deck, cp210x — NOT ttyACM0, that's the Deck's own controller). Empty = pick in the UI.
  baud: 115200    # handset-link UART; 115200 works over the Aeris Link USB/CP2102 (420000 is the over-air rate, not this).
  # Module-side setup (CRSF pins 3/1, UART-inverted off, and connecting via USB-A —
  # a direct USB-C↔USB-C link to the Deck won't even power it) lives in the README;
  # these two app settings assume that's already done.

sender:
  rate_hz: 250            # CRSF frames per second (50-500; 150 matches a handset).
  address: "0xEE"         # 0xEE = CRSF transmitter (handset->module). 0xC8 also works.
  stale_timeout_ms: 250   # if the UI snapshot is older than this, transmit failsafe.

safety:
  arm_source: menu        # button that arms (see source names below)
  kill_source: view       # button that instantly disarms
  arm_toggle: true        # true: press toggles armed; false: hold-to-arm (deadman)

video:                    # analog FPV feed on the Run screen (Linux/Deck only; UVC capture dongle)
  enabled: false
  device: ""              # V4L2 node, e.g. /dev/video0 — pick it in Settings

osd:                      # Run-screen overlay; toggles also live in Settings
  vehicle_name: ""        # shown bottom-center
  crosshair: true
  arm_state: true
  show_name: true
  video_info: false       # debug: capture resolution / format / fps
  telemetry: true         # ELRS link quality / RSSI / battery (needs a bound, powered RX)
  crosshair_x: 0          # px offset from center — calibrate the reticle to where the payload actually hits
  crosshair_y: 0

detect:                   # person detection (Linux/Deck; needs an ONNX model + libonnxruntime.so beside the binary)
  enabled: false
  model_path: model.onnx  # YOLOv8 person/COCO ONNX; a relative name is found next to the binary
  lib_path: ""            # libonnxruntime.so; empty = auto-found next to the binary
  input_size: 640         # must match the model export (320 for a smaller/faster model)
  conf: 0.4               # detection confidence threshold
  rate_hz: 10             # max inference rate

autoaim:                  # drive a pan/tilt turret to hold the locked person on the crosshair (opt-in)
  pan_channel: 0          # 1-based RC channel for pan; 0 = off (target lock stays visual-only)
  tilt_channel: 0         # 1-based RC channel for tilt; 0 = off
  pan_gain: 2.0           # higher = faster turret slew per unit aim error (too high oscillates)
  tilt_gain: 2.0
  pan_invert: false       # flip if the turret drives away from the target
  tilt_invert: false
  deadband: 0.05          # normalized aim error below which it holds still (the box is smoothed, so this can be tight)
  damp: 0.5               # derivative brake on apparent target velocity — raise to cut overshoot/oscillation
  aim_height: 0.25        # vertical aim point down the target box: 0=head, 0.25=upper torso, 0.5=center, 1=feet
  lock_source: r3         # button to autolock the nearest target / release; D-pad left/right pick among targets
  # pan_gain/tilt_gain/deadband/damp/aim_height are also tunable live on the Mapping
  # screen (select the pan or tilt channel) — dial it in on the Deck without editing YAML.

# 16 channels. Each: type is one of none | analog | switch2 | switch3 | fixed.
#
# source / source2 names:
#   analog axes:  left_stick_x  left_stick_y  right_stick_x  right_stick_y
#                 left_trigger  right_trigger  triggers   (triggers = R2 fwd / L2 rev)
#   buttons:      a b x y  lb rb  l3 r3  view menu steam
#                 dpad_up dpad_down dpad_left dpad_right
#
# tick values: 172 = ~1000us, 992 = 1500us (center), 1811 = ~2000us.
channels:
  - name: Steering        # CH1
    type: analog
    source: left_stick_x
    reverse: false
    expo: 0.0             # -1..1; >0 softens response near center (finer control), <0 sharpens
    scale: 1.0           # input multiplier / "rate": <1 = gentler/less sensitive, 1 = full (up to 2)
    deadzone: 0.0         # 0..0.9 fraction ignored near rest
    trim: 0               # ticks added after scaling
    min: 172
    max: 1811
    failsafe: 992

  - name: Throttle        # CH2 — R2 forward / L2 reverse
    type: analog
    source: triggers
    expo: 0.4             # finer control near idle/center — tames a touchy low end
    scale: 1.0           # drop below 1 to cap overall sensitivity (e.g. 0.6 = gentler throttle)
    min: 172
    max: 1811
    failsafe: 992         # neutral = stop for a bidirectional ESC

  - name: Aux1            # CH3 — A button toggles
    type: switch2
    source: a
    # press_mode: toggle    # default; click flips Low<->High
    # press_mode: momentary # held = High, released = Low
    # press_mode: pulse     # held = oscillate Low<->High; pulse_hz sets the rate (default 4)
    # pulse_hz: 4
    low: 172
    high: 1811
    failsafe: 992

  - name: Aux2            # CH4 — B button toggles
    type: switch2
    source: b
    low: 172
    high: 1811
    failsafe: 992

  # Example of a 3-position switch (uncomment & adapt):
  # - name: Mode
  #   type: switch3
  #   source: dpad_up      # -> high
  #   source2: dpad_down   # -> low
  #   low: 172
  #   mid: 992
  #   high: 1811
  #   failsafe: 992

  - { name: CH5,  type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH6,  type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH7,  type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH8,  type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH9,  type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH10, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH11, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH12, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH13, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH14, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH15, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
  - { name: CH16, type: none, source: none, min: 172, max: 1811, failsafe: 992 }
